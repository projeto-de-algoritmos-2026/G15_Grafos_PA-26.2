repo_url: https://github.com/projeto-de-algoritmos-2026/G15_Grafos_PA-26.2
repo_name: G15_Grafos_PA-26.2

site_url: https://github.com/projeto-de-algoritmos-2026/G15_Grafos_PA-26.2
site_name: Projeto de gay
site_description: teste
site_author: Grupo 15 - 2026.2

nav:
  - Home: index.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Modo Noturno
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Modo Claro


markdown_extensions:
  - pymdownx.emoji
  - pymdownx.tasklist
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
  - attr_list

